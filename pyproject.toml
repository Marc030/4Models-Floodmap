[project]
name = "flood-models-hamburg"
version = "0.1.0"
description = "Jupyter notebook that visualizes sea-level rise for Hamburg using four flood-fill models on DEMs from OpenTopography."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # Geospatial core
    "rasterio>=1.3.10,<2.0",
    "rioxarray>=0.15",
    "geopandas>=1.0",
    "shapely>=2.0",

    # Numerical / flow
    "numpy>=1.26,<3.0",
    "scipy>=1.11",
    "requests>=2.32",

    # Mapping / UI
    "leafmap[raster]>=0.30",
    "ipywidgets>=8.1",

    # Hydrology (reserved for future Flowtub work)
    "pysheds>=0.4",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Pure-Python project: nur Metadaten, keine Pakete.
packages = []

# === uv ===
# Lockfile: uv.lock wird von `uv sync` automatisch erzeugt.
[tool.uv]
# Python-Version, die uv verwenden soll.
required-version = ">=0.4.0"

# === Jupyter-Kernel ===
# Erlaubt `uv run jupyter lab` mit dem richtigen Kernel.
[tool.uv.kernel]
# Wird beim ersten `uv run jupyter lab` automatisch als Kernel registriert.
display-name = "Python (flood-models-hamburg)"
